server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    charset utf-8;
    charset_types text/css text/plain application/javascript application/json;
    server_tokens off;

    # Clean URLs like the original (GitHub Pages): /transfem -> transfem.html
    location / {
        try_files $uri $uri.html $uri/ =404;
        # Pages change on every re-sync. This must live here: clean URLs like
        # /transfem are served by try_files and never reach the .html block below.
        add_header Cache-Control "no-cache";
    }

    # Pages change on every re-sync; let browsers revalidate.
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Video captions: nginx's default mime.types lacks .vtt, and browsers
    # ignore <track> files that aren't served as text/vtt.
    location ~* \.vtt$ {
        types { text/vtt vtt; }
        expires 7d;
    }

    # Images, fonts, video: cache for a week. nginx serves byte ranges, so
    # the <video> players can seek without downloading the whole file.
    location ~* \.(?:png|jpe?g|gif|svg|webp|ico|woff2?|ttf|otf|mp4|vtt|css|js)$ {
        expires 7d;
        access_log off;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript text/plain application/json image/svg+xml text/vtt;
}
