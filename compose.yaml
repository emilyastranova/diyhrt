services:
  mirror:
    # nginx stable branch; `docker compose pull` picks up 1.30.x security fixes.
    image: nginx:1.30-alpine
    container_name: diyhrt-mirror
    restart: unless-stopped
    ports:
      # Put a TLS-terminating reverse proxy (Caddy, Traefik, Cloudflare Tunnel...)
      # in front for your domain. Change the host side with MIRROR_PORT.
      - "${MIRROR_PORT:-8080}:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
